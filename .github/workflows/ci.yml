name: ProtocolZ CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  unit-tests:
    name: Unit tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Run test suite
        run: make test

  linux-integration:
    name: Linux integration (root, nftables, proc)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Linux integration tools
        run: |
          sudo apt-get update
          sudo apt-get install -y nftables iproute2

      - name: Check integration prerequisites
        run: |
          sudo -E env "PATH=$PATH" python3 -c \
            "import os, shutil, sys; print('Python:', sys.version); print('Root:', os.geteuid() == 0); print('nft:', shutil.which('nft')); print('ip:', shutil.which('ip')); assert os.geteuid() == 0 and shutil.which('nft') and shutil.which('ip')"

      - name: Run complete suite with root privileges
        run: sudo -E env "PATH=$PATH" make test
